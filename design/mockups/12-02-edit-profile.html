<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .avatar-wrap { width: 96px; height: 96px; margin: 8px auto 6px; position: relative; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: var(--forest-900); color: var(--mint); display: grid; place-items: center; font-size: 32px; font-weight: 800; box-shadow: 0 10px 24px rgba(14,57,36,.22); }
  .cam { position: absolute; right: -2px; bottom: 2px; width: 34px; height: 34px; border-radius: 50%; background: var(--emerald); color: #fff; display: grid; place-items: center; border: 3px solid var(--bg); }
  .cam svg { width: 16px; height: 16px; }
  .change { text-align: center; font-size: 13px; font-weight: 600; color: var(--emerald); margin-bottom: 18px; }
  .flag { display: flex; align-items: center; gap: 6px; padding-right: 10px; border-right: 1px solid var(--border); font-weight: 600; font-size: 14px; }
  .flag i, .flag span.f { width: 22px; height: 15px; border-radius: 3px; background: linear-gradient(#20a0e3 0 50%, #fad201 50% 75%, #20603d 75%); display: inline-block; }
  .verified-tag { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--emerald); display: flex; align-items: center; gap: 4px; }
  .verified-tag svg { width: 14px; height: 14px; color: var(--emerald); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style></head>
<body><div class="device">
  <div class="status"></div>
  <div class="header">
    <div class="icon-btn"><i data-i="chevron-left"></i></div>
    <h1>Edit Profile</h1>
    <div class="spacer"></div>
  </div>
  <div class="content">
    <div class="avatar-wrap"><div class="avatar">RU</div><div class="cam"><i data-i="camera"></i></div></div>
    <div class="change">Change photo</div>

    <div class="field"><label>Full Name</label><div class="input focus">Roohi Uwase</div></div>
    <div class="field">
      <label>Phone Number</label>
      <div class="input"><div class="flag"><span class="f"></span>+250</div><span>788 123 456</span>
        <span class="verified-tag"><i data-i="shield"></i>Verified</span></div>
      <div class="hint">Changing your number requires a new verification code.</div>
    </div>
    <div class="field"><label>Email <span style="color:var(--muted);font-weight:500">(optional)</span></label><div class="input"><i data-i="mail"></i><span class="ph">For receipts, e.g. roohi@email.com</span></div></div>
    <div class="field"><label>Home Stop</label><div class="input"><i data-i="pin"></i><span>Nyabugogo Bus Park</span><span style="margin-left:auto;color:var(--muted)"><i data-i="chevron-down"></i></span></div>
      <div class="hint">Used to suggest routes and nearby buses on Home.</div></div>
  </div>
  <div class="footer"><div class="btn">Save Changes</div></div>
  <div class="home-indicator"></div>
</div>
<script src="icons.js"></script></body></html>
