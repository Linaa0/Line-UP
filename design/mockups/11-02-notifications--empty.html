<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  .empty { position: absolute; top: 250px; left: 0; right: 0; text-align: center; padding: 0 44px; }
  .halo { width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 26px; display: grid; place-items: center;
          background: radial-gradient(circle, #d9f7e8 0 52%, #ecfaf2 53% 100%); }
  .halo .core { width: 78px; height: 78px; border-radius: 50%; background: var(--forest-900); color: var(--mint); display: grid; place-items: center; box-shadow: 0 12px 26px rgba(14,57,36,.28); }
  .halo svg { width: 34px; height: 34px; }
  .empty h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .empty p { font-size: 14.5px; color: var(--text-2); line-height: 1.55; }
</style></head>
<body><div class="device">
  <div class="status"></div>
  <div class="header">
    <div class="icon-btn"><i data-i="chevron-left"></i></div>
    <h1>Notifications</h1>
    <div class="icon-btn"><i data-i="sliders"></i></div>
  </div>
  <div class="content">
    <div class="chips"><div class="chip active">All</div><div class="chip">Trips</div><div class="chip">Payments</div><div class="chip">Alerts</div></div>
  </div>
  <div class="empty">
    <div class="halo"><div class="core"><i data-i="bell"></i></div></div>
    <h2>You're all caught up</h2>
    <p>Bus arrivals, queue updates and payment receipts will show up here as they happen.</p>
  </div>
  <div class="footer">
    <div class="btn ghost"><i data-i="sliders"></i>Notification settings</div>
  </div>
  <div class="home-indicator"></div>
</div>
<script src="icons.js"></script></body></html>
